<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <h1>Register Form</h1>
     <form action="#" method="get" id="myform">

        <div>
            <label for="name">Name</label> <br>
            <input type="text" name="name" id="name" readonly value="Aung Myint Thu" >
        </div>

        <br>

        <div>
            <label for="email">Email</label> <br>
            <input type="email" name="email" id="email" >
        </div>

        <br>

        <div>
            <label for="phone">Phone</label> <br>
            <input type="number" name="phone" id="phone">
        </div>

        <br>

        <div>
            <label for="gender">Gender</label> <br><br>

            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>

            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>

            <input type="radio" name="gender" id="other" value="other">
            <label for="other">Other</label>            
        </div>

        <br>
        
        <div>
            <label for="hobby">Hobby</label> <br><br>

           <div>
            <input type="checkbox" name="hobby" id="reading" value="reading">
            <label for="reading">Reading</label>
           </div>

           <div>
            <input type="checkbox" name="hobby" id="sport" value="sport">
            <label for="sport">Sport</label>
           </div>

           <div>
            <input type="checkbox" name="hobby" id="music" value="music">
            <label for="music">Music</label>
           </div>

           <div>
            <input type="checkbox" name="hobby" id="movie" value="movie">
            <label for="movie">Movie</label>
           </div>

           <div>
            <input type="checkbox" name="hobby" id="game" value="game">
            <label for="game">Game</label>
           </div>

        </div>

        <fieldset>
            <legend>Role</legend>

            <ul>
                <li>this is role1</li>
                <li>this is role2</li>
                <li>this is role3</li>
                <li>this is role4</li>
                <li>this is role5</li>
            </ul>
        </fieldset>
 



        <br>

        <button type="submit" class="register-btn">Submit</button>

     </form>

















    
</body>
</html>
