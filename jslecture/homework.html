<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>homework</title>
</head>
<body>
    <script>
        for(let i = 5; i > 0; i--){
            for(let k = 0; k < i; k++){
                document.write(`*`);
            }
            document.write(`<br>`)
        }


        let num = prompt(`enter a number`)

        for( let i = 1; i < 13; i++){
            document.write(`${num} x ${i} = ${num*i} <br>`)


        }



    </script>
    
</body>
</html>
