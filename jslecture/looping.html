<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>looping</title>
</head>
<body>
    <h1>looping</h1>
    <script>
        
        // for loop
        // for(){

        // }


        for(let i = 0; i < 5; i++){
            for(let k = 0; k <= i; k++){
                document.write(`*`);
            }
            document.write(`<br>`)
        }


        // while loop

        let number = parseInt(prompt("enter a number"));

        // while(number < 100){
        //     document.write(`your number is ${number}<br>`);

        //     number+= 10;
        // }


        // do while loop

        // do{
        // code
        // uphade
        // }while()


        do{
            document.write(`your number is ${number}<br>`)
             
            number += 20;
        }while(number < 100);


    </script>
</body>
</html>
