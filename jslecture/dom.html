<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myid">DOM <i>lesson</i></h1>
    <p class="myclass">class selector one</p>
    <p class="myclass">class selector two</p>
    <p class="myclass">class selector three</p>

    <script>
        // id selector
        let id = document.getElementById("myid");
        console.log(id.innerHTML);

        document.write(id.innerText);
        document.write(id.innerHTML);

        // class selector

        let myclass = document.getElementsByClassName("myclass");
        console.log(myclass);
        document.write("<br>");
        document.write(myclass[2].innerText);
        document.write("<br>");
        document.write(myclass[1].innerHTML);
        

        // query selector

        let myQueryId = document.querySelector("#myid");
        console.log(myQueryId.innerText);

        let myQueryClass = document.querySelector(".myclass");
        console.log(myQueryClass.innerText);

        // tag selector

        let myTag = document.getElementsByTagName("p");
        console.log(myTag[0].innerText);

        // querySelectorAll

        let myQueryAll = document.querySelectorAll(".myclass");
        console.log(myQueryAll[1].innerText);



    </script>
    
</body>
</html>
