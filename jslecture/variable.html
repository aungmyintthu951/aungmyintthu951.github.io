<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <h1>
        Hello World
    </h1>
    <script>
        // global variable
        var name = "Aaron";
        var name = "Aaron uphated";
        console.log(name);

        //block scope variable
        let fatherName = "kyaw soe khing";
        // let fatherName = "kyaw soe khing"; do not write again
        fatherName = "kyaw soe khing uphated";
        console.log(fatherName);

        // const variable
        const motherName = "tin tin aye";
        // const motherName = "tin tin aye"; do not write again
        // motherName = "tin tin aye uphated"; do not write again
        console.log(motherName);
    </script>
</body>
</html>
