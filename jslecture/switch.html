<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch</title>
</head>
<body>
    <h1>Swith</h1>



    <script>
        let age = 20;

        switch(age){
            case 18:
                document.write('I am 18 years old.')
                break;
            case 19:
                document.write('I am 20 years old.')
                break;
            default:
                document.write('I am 18 or 20 years old.')
                break;

        }

    </script>
</body>
</html>
