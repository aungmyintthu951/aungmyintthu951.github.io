<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Date</h1>
    <script>

    // date
    let date = new Date();
    console.log(date);

    let dates = date.getDate();
    console.log(dates);

    let getYear = date.getFullYear();
    console.log(getYear)

    let getMonth = date.getMonth();
    console.log(getMonth); // 0 to 11

    let getDay = date.getDay();
    console.log(getDay) // 0 to 6

    let getHour = date.getHours();
    console.log(getHour);

    </script>
    
</body>
</html>
